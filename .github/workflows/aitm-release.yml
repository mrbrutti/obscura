name: aitmproxy release

# Trimmed from release.yml for the aitmproxy fork: tags `aitm-v*`, the render
# build only, the four shipped targets (no Windows), `obscura` alone (no
# `obscura-worker`), and a SHA256SUMS file next to the tarballs.

on:
  push:
    tags:
      - 'aitm-v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # Ubuntu 22.04 so the binary works on glibc 2.35 LTS hosts.
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            # Native build on GitHub's ARM runner.
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            # Must run on a native Intel runner: the V8 startup snapshot baked
            # at build time is architecture specific (upstream issue #290).
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build render release binary
        run: cargo build --release --target ${{ matrix.target }} -p obscura-cli --bins --features render

      - name: Smoke test (V8 snapshot, --ca-cert, screenshot)
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/obscura
          "$BIN" --version
          "$BIN" --help | grep -q -- '--ca-cert'
          "$BIN" fetch "data:text/html,<title>ok</title>" --eval "1+1"
          "$BIN" fetch "data:text/html,<style>body{margin:0;background:%23123456}</style>" --screenshot smoke.png
          test -s smoke.png
          rm smoke.png
          if "$BIN" --ca-cert /nonexistent/ca.pem fetch "data:text/html,<title>x</title>"; then
            echo "a missing --ca-cert file must fail fast" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          tar czf dist/obscura-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release obscura

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/obscura-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # This job never checks out or executes repository code. The write token
      # is available only while collecting and publishing the built artifacts.
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum obscura-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
